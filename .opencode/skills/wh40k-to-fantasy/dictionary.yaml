# Термины без словоизменения — можно replace без участия модели
invariant:
  - from: "PR"
    to: "PR"        # не меняется, но фиксирует что термин НЕ трогаем при прочих заменах
  - from: "(Psyker)"
    to: "(Caster)"

# Термины, требующие согласования падежа/числа — решает модель
inflected:
  - from: "Психосила"
    to: "Заклинание"
  - from: "Псайкер"
    to: "Заклинатель"
  - from: "Психотест"
    to: "Тест магии"
  - from: "Путь Силы"
    to: "Путь магии"
  - from: "Природа Дара"
    to: "Природа магии"
  - from: "Варп"
    to: "Магия"
  - from: "Энергии Варпа"
    to: "Магическая энергия"
  - from: "Психический феномен"
    to: "Магический феномен"
  - from: "Психическая активность"
    to: "Магическая активность"
  - from: "Forbidden Lore (Psykers)"
    to: "Forbidden Lore (Magic)"
    to_ru: "Запретное знание (Магия)"
  - from: "Psyker (Trait)"
    to: "Caster (Trait)"
    to_ru: "Заклинатель (Трейт)"
  - from: "Psyniscience"
    to: "Spellcraft"
    to_ru: "Искусство Магии"
  - from: "Очко Бесчестья"
    to: "Очко Славы"